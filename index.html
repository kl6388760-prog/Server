<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swap Mini App</title>
    
    <!-- Подключение шрифта Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Подключение Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            /* Цвета из скриншота */
            --bg-color: #131b23;
            --text-main: #ffffff;
            --text-muted: #8b9aa9;
            --blue-accent: #2ea6de;
            --max-color: #3b9cf6;
            --input-bg: transparent;
            --swap-icon-bg: #1c2b3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Применяем шрифт Inter */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            padding: 20px;
            height: 100vh;
            user-select: none;
            -webkit-font-smoothing: antialiased; /* Для более четкого шрифта на iOS/Mac */
        }

        /* Верхняя панель */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500; /* Inter Medium */
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .max-btn {
            color: var(--max-color);
            font-weight: 600; /* Inter SemiBold */
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .max-btn svg {
            fill: var(--text-muted);
            margin-right: 2px;
        }

        /* Строка ввода */
        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .token-select {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 600; /* Inter SemiBold */
            cursor: pointer;
        }

        .token-select svg.chevron {
            width: 14px;
            height: 14px;
            stroke: var(--text-main);
            stroke-width: 2.5;
            fill: none;
            margin-left: 2px;
        }

        input[type="number"] {
            background: var(--input-bg);
            border: none;
            outline: none;
            color: var(--text-muted);
            font-size: 42px;
            font-weight: 500; /* Inter Medium */
            text-align: right;
            width: 60%;
            font-family: inherit;
            /* Убираем стандартные стрелочки у input number */
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        input[type="number"]:focus {
            color: var(--text-main);
        }

        /* Кнопка обмена (Стрелочки) */
        .swap-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 40px;
            margin: 10px 0;
        }

        .swap-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #253442;
            z-index: 1;
        }

        .swap-btn {
            background-color: var(--swap-icon-bg);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .swap-btn:active {
            background-color: #253442;
        }

        .swap-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--blue-accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Иконки токенов */
        .token-icon {
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>

    <!-- Блок "Вы отправляете" -->
    <div class="header-row">
        <span>Вы отправляете</span>
        <div class="max-btn" onclick="setMax()">
            <svg width="14" height="14" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H8v-2h2V8h2v3h2v2h-2v4z"/></svg>
            0 МАКС
        </div>
    </div>

    <div class="input-row">
        <div class="token-select">
            <!-- Иконка GRAM -->
            <svg class="token-icon" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="16" fill="#2ea6de"/>
                <path d="M16 6L9 15L16 19L23 15L16 6Z" fill="white"/>
                <path d="M16 26L9 17L16 21L23 17L16 26Z" fill="white" opacity="0.7"/>
            </svg>
            GRAM 
            <svg class="chevron" viewBox="0 0 24 24"><path d="M9 18L15 12L9 6"/></svg>
        </div>
        <input type="number" id="send-input" placeholder="0" value="0" oninput="calculateSwap()">
    </div>

    <!-- Разделитель с кнопкой обмена -->
    <div class="swap-container">
        <div class="swap-btn">
            <svg viewBox="0 0 24 24">
                <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
            </svg>
        </div>
    </div>

    <!-- Блок "Вы получаете" -->
    <div class="header-row" style="margin-top: 10px;">
        <span>Вы получаете</span>
    </div>

    <div class="input-row">
        <div class="token-select">
            <!-- Иконка USDT -->
            <svg class="token-icon" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="16" fill="#26a17b"/>
                <path d="M18.5 13V10.5H22.5V7.5H9.5V10.5H13.5V13C10.2 13.2 7.8 13.9 7.8 14.8C7.8 15.7 10.2 16.4 13.5 16.6V23.5H18.5V16.6C21.8 16.4 24.2 15.7 24.2 14.8C24.2 13.9 21.8 13.2 18.5 13ZM16 15.6C12.9 15.6 10.4 15 10.4 14.3C10.4 13.6 12.9 13 16 13C19.1 13 21.6 13.6 21.6 14.3C21.6 15 19.1 15.6 16 15.6Z" fill="white"/>
            </svg>
            USDT 
            <svg class="chevron" viewBox="0 0 24 24"><path d="M9 18L15 12L9 6"/></svg>
        </div>
        <input type="number" id="receive-input" placeholder="0" value="0" readonly>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Разворачиваем приложение на весь экран
        tg.expand();

        // Устанавливаем цвет хедера (под цвет фона)
        tg.setHeaderColor('#131b23');
        tg.setBackgroundColor('#131b23');

        // --- НАСТРОЙКА НАТИВНОЙ КНОПКИ TELEGRAM ---
        const mainButton = tg.MainButton;
        
        mainButton.setText("ПРОДОЛЖИТЬ");
        mainButton.setParams({
            color: '#2ea6de', 
            text_color: '#ffffff',
            is_active: true,
            is_visible: true
        });

        // Обработчик нажатия на нативную кнопку
        mainButton.onClick(function() {
            const sendValue = document.getElementById('send-input').value;
            const receiveValue = document.getElementById('receive-input').value;
            
            tg.sendData(JSON.stringify({
                action: "swap",
                from: "GRAM",
                to: "USDT",
                amountSend: sendValue,
                amountReceive: receiveValue
            }));
        });

        // --- ЛОГИКА ИНТЕРФЕЙСА ---

        const exchangeRate = 0.85; 

        function calculateSwap() {
            const sendInput = document.getElementById('send-input');
            const receiveInput = document.getElementById('receive-input');
            
            let val = parseFloat(sendInput.value);
            if (isNaN(val)) val = 0;
            
            receiveInput.value = (val * exchangeRate).toFixed(2);
        }

        function setMax() {
            const sendInput = document.getElementById('send-input');
            sendInput.value = "1000"; 
            calculateSwap();
        }
    </script>
</body>
</html>
